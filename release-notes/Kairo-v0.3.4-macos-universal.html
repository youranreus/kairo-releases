<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kairo 0.3.4 更新说明</title>
    <style>
      :root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; line-height: 1.6; color: #1f2328; background: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { color: #f0f6fc; background: #0d1117; } }
      body { max-width: 640px; margin: 0 auto; padding: 20px 24px; }
      h2 { font-size: 1.15rem; margin-top: 1.4em; border-bottom: 1px solid rgba(128,128,128,0.2); padding-bottom: 0.3em; }
      h3 { font-size: 0.95rem; color: #57606a; margin-top: 1em; }
      @media (prefers-color-scheme: dark) { h3 { color: #8b949e; } }
      ul { padding-left: 20px; margin: 0.4em 0; }
      li { margin: 0.25em 0; }
      .security { font-size: 0.85rem; color: #57606a; margin-top: 1.5em; padding-top: 0.8em; border-top: 1px dashed rgba(128,128,128,0.2); }
      @media (prefers-color-scheme: dark) { .security { color: #8b949e; } }
    </style>
  </head>
  <body>
    <h2>Kairo 0.3.4 本次更新</h2>
    <h3>新增</h3>
    <ul>
      <li>工具设置支持配置 Tavily 密钥并开启联网搜索，对话回答可展示搜索来源与失败提示</li>
    </ul>
    <h3>优化</h3>
    <ul>
      <li>优化回答排版、流式、公式与连续选区，修复长对话顶部遮挡，代码块采用纯色背景、原生玻璃操作组及复制换行提示</li>
      <li>精简设置与密钥编辑布局，已配置密钥显示密码遮罩并按编辑内容更新，回复使用内容区全宽，搜索调用可保留并展开查看参数与结果</li>
    </ul>
    <div class="security">
      <p>本更新包由 Apple Developer ID 签名并通过 Apple 公证，支持 arm64 与 x86_64 通用二进制。</p>
      <p><a href="https://github.com/youranreus/kairo-releases/releases/tag/v0.3.4" target="_blank">在 GitHub Releases 查看完整发布</a></p>
    </div>
  </body>
</html>
